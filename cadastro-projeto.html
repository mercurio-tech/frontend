<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/cadastro.css" />
        <link
            href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css"
            rel="stylesheet"
        />
        <link
            href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css"
            rel="stylesheet"
        />
        <script src="scripts/cadastro.js"></script>
        <title>Cadastro - Colégio Mercúrio</title>
    </head>
    <body>
        <nav>
            <div class="logo">
                <img class="logoImg" src="assets/images/logo.png" />
                <div class="logoTexts">
                    <h2>Colégio Mercúrio</h2>
                    <h3>Semana de Iniciação Científica</h3>
                </div>
            </div>
            <div class="links">
                <a href="index.html">Início</a>
                <a href="cadastro-projeto.html">Cadastro de Projeto</a>
            </div>

            <div class="signIn">
                <button><i class="bx bx-user"></i>Entrar</button>
            </div>
        </nav>
        <section class="middle">
            <div class="projectCreation">
                <h2>Cadastro de Projeto</h2>
                <h3>Preencha as informações para registrar o Projeto.</h3>
                <hr />
                <label for="title">Título do Projeto</label>
                <input
                    type="text"
                    id="title"
                    placeholder="Ex: Sistema Inteligente de Irrigação Automatizada"
                />
                <label for="subtitle">Subtítulo</label>
                <input
                    type="text"
                    id="subtitle"
                    placeholder="Ex: Monitoramento remoto com IoT e Inteligência Artificial"
                />
                <label for="tags">Palavras-chave</label>
                <input
                    type="text"
                    id="tags"
                    placeholder="Separe por virgulas"
                />
                <label for="type">Tipo</label>
                <select id="type">
                    <option value="SIC">SIC</option>
                    <option value="SIP">SIP</option>
                </select>
                <label for="description">Descrição</label>
                <textarea
                    type="text"
                    id="description"
                    placeholder="Descreva os detalhes, metodologia utilizada e resultados do projeto."
                    cols="50"
                    rows="5"
                ></textarea>
                <div class="row">
                    <div class="column flex-fill">
                        <label for="professor">Professor Orientador</label>
                        <input
                            type="text"
                            id="professor"
                            placeholder="Ex: Prof. José Roberto"
                        />
                    </div>
                    <div class="column flex-fill">
                        <label for="year">Ano Letivo</label>
                        <input type="text" id="year" placeholder="Ex: 2026" />
                    </div>
                </div>
                <label for="authors">Nome dos Alunos</label>
                <input
                    type="text"
                    id="authors"
                    placeholder="Separe por virgulas"
                />
                <label for="dropZone">Imagem do Projeto</label>
                <div class="drop-zone" id="dropZone">
                    <input
                        type="file"
                        id="fileInput"
                        accept="image/jpeg,image/png,image/jpg"
                        hidden
                    />
                    <div class="drop-zone-content">
                        <i class="bx bx-image-plus"></i>
                        <p class="drop-zone-text">
                            Clique para fazer upload ou arraste o arquivo
                        </p>
                        <p class="drop-zone-hint">
                            Suporta PNG, JPG e JPEG (Tamanho Máximo: 10MB)
                        </p>
                    </div>

                    <div class="file-list" id="fileList"></div>
                </div>
                <div class="right action-button-div">
                    <button>Cancelar</button>
                    <button class="main">Salvar Projeto</button>
                </div>
            </div>
        </section>
    </body>
</html>
