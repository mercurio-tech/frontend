<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/form.css" />
        <link
            href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css"
            rel="stylesheet"
        />
        <link
            href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css"
            rel="stylesheet"
        />
        <script src="scripts/api.js"></script>
        <script src="scripts/auth.js"></script>
        <script src="scripts/nav.js"></script>
        <script src="scripts/senha.js"></script>
        <title>Registrar - Colégio Mercúrio</title>
    </head>
    <body>
        <dialog id="account-created-dialog">
            <div class="dialogBody">
                <h1>Conta criada com sucesso</h1>
                <div class="middle">
                    <button commandfor="account-created-dialog" command="close">
                        Fechar
                    </button>
                </div>
            </div>
        </dialog>
        <nav>
            <div class="logo">
                <a href="index.html"
                    ><img
                        class="logoImg"
                        src="assets/images/logo.png"
                        a
                        href="index.html"
                /></a>
                <div class="logoTexts">
                    <h2>Colégio Mercúrio</h2>
                    <h3>Semana de Iniciação Científica</h3>
                </div>
            </div>
            <div class="links">
                <a href="index.html">Início</a>
                <a
                    href="cadastro-projeto.html"
                    id="cadastro-projeto"
                    class="hidden"
                    >Cadastro de Projeto</a
                >
                <a href="sobre.html">Sobre</a>
            </div>

            <div class="signIn">
                <a href="registrar.html" id="register" class="hidden"
                    ><i class="bx bx-user"></i>Registrar conta</a
                >
                <button id="logout" class="hidden">Sair da conta</button>
                <a href="login.html" id="login" class="hidden"
                    ><i class="bx bx-user"></i>Entrar como avaliador</a
                >
            </div>
        </nav>
        <section class="middle">
            <div class="form">
                <h2>Registrar</h2>
                <h3>Registre uma nova conta</h3>
                <hr />
                <label for="name">Login</label>
                <div>
                    <input
                        type="text"
                        id="name"
                        placeholder="Ex: usuario123"
                        oninput="validateName()"
                    />
                    <p id="name-error" class="hidden"></p>
                </div>

                <label for="password">Senha</label>
                <div>
                    <input
                        type="password"
                        id="password"
                        placeholder="Ex: senha123"
                        oninput="validatePassword()"
                    />
                    <button
                        class="show-password"
                        type="button"
                        onclick="togglePasswordVisibility()"
                    >
                        <i
                            class="bx bx-eye-closed"
                            id="toggle-password-visibility"
                        ></i>
                    </button>
                    <p id="password-error" class="hidden"></p>
                </div>
                <p id="validation-error" class="hidden"></p>
                <label for="perms">Nivel de Permissão</label>
                <select id="perms">
                    <option value="999">
                        Admin (pode criar outras contas)
                    </option>
                    <option value="100">Editor</option>
                </select>
                <div class="middle">
                    <button class="main" onclick="onRegister()">
                        Registrar
                    </button>
                </div>
            </div>
        </section>
    </body>
</html>
